name: CI/CD Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: [
          'user-service',
          'product-service',
          'order-service',
          'discount-service',
          'payment-service',
          'cancel-service',
          'refund-service',
          'gateway-service'
        ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: GHCR 이미지 경로 (소문자)
        id: ghcr
        run: echo "repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :${{ matrix.service }}:build -x test

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.ghcr.outputs.repo_lc }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-client:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: GHCR 이미지 경로 (소문자)
        id: ghcr
        run: echo "repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for client image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.ghcr.outputs.repo_lc }}/client
          tags: |
            type=sha,prefix=,format=long

      - name: Build and push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 사전: 클러스터에 kubectl apply -k k8s/ 로 네임스페이스·백엔드·Blue/Green 리소스가 있어야 함.
  # Secret KUBE_CONFIG: kubeconfig 전체를 base64 인코딩한 값.
  # 클러스터가 비공개 GHCR 이미지를 pull 하려면 imagePullSecret(ghcr) 설정 필요.
  deploy-blue-green:
    name: Kubernetes Blue/Green 배포
    runs-on: ubuntu-latest
    needs: [ build-and-push, build-client ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.29.0"

      - name: Blue/Green 배포
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          REGISTRY: ${{ env.REGISTRY }}
          K8S_NAMESPACE: sparta-msa
        run: |
          if [ -z "${KUBE_CONFIG_B64}" ]; then
            echo "::warning::Secret KUBE_CONFIG 가 없어 Kubernetes 배포를 건너뜁니다. base64 인코딩된 kubeconfig 를 저장소 시크릿으로 추가하세요."
            exit 0
          fi
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          chmod +x k8s/scripts/deploy-blue-green.sh
          k8s/scripts/deploy-blue-green.sh
