plugins {
    id 'java-library'
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-web:3.2.11'
    api 'org.springframework.boot:spring-boot-starter-data-jpa:3.2.11'
    api 'org.springframework.boot:spring-boot-starter-data-redis:3.2.11'
    api 'org.springframework.boot:spring-boot-starter-security:3.2.11'
    api 'org.springframework.boot:spring-boot-starter-validation:3.2.11'
    
    // JWT
    api 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Jackson
    api 'com.fasterxml.jackson.core:jackson-annotations'
}
