      context: ./discount-service
      dockerfile: Dockerfile
    container_name: discount-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://discount-mysql:3306/discount_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KAFKA_SERVERS: kafka:29092
      JWT_SECRET: your-256-bit-secret-key-here-minimum-32-characters-required
    depends_on:
      discount-mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # Payment Service
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://payment-mysql:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KAFKA_SERVERS: kafka:29092
      JWT_SECRET: your-256-bit-secret-key-here-minimum-32-characters-required
    depends_on:
      payment-mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # Cancel Service
  cancel-service:
    build:
      context: ./cancel-service
      dockerfile: Dockerfile
    container_name: cancel-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://cancel-mysql:3306/cancel_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KAFKA_SERVERS: kafka:29092
      JWT_SECRET: your-256-bit-secret-key-here-minimum-32-characters-required
    depends_on:
      cancel-mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # Refund Service
  refund-service:
    build:
      context: ./refund-service
      dockerfile: Dockerfile
    container_name: refund-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://refund-mysql:3306/refund_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KAFKA_SERVERS: kafka:29092
      JWT_SECRET: your-256-bit-secret-key-here-minimum-32-characters-required
    depends_on:
      refund-mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: msa-client
    ports:
      - "3000:80"
    depends_on:
      - gateway-service


volumes:
  user_mysql_data:
  product_mysql_data:
  order_mysql_data:
  discount_mysql_data:
  payment_mysql_data:
  cancel_mysql_data:
  refund_mysql_data:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
