spring:
  application:
    name: order-service-test
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: false
  kafka:
    consumer:
      group-id: order-service-test
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: >-
          OrderCreatedEvent:com.ecommerce.orderservice.event.OrderCreatedEvent,
          OrderCancelledEvent:com.ecommerce.orderservice.event.OrderCancelledEvent,
          StockDecreasedEvent:com.ecommerce.orderservice.event.StockDecreasedEvent,
          StockDecreaseFailedEvent:com.ecommerce.orderservice.event.StockDecreaseFailedEvent,
          CouponUsedEvent:com.ecommerce.orderservice.event.CouponUsedEvent,
          CouponUseFailedEvent:com.ecommerce.orderservice.event.CouponUseFailedEvent,
          PaymentFailedEvent:com.ecommerce.orderservice.event.PaymentFailedEvent,
          PaymentCompletedEvent:com.ecommerce.orderservice.event.PaymentCompletedEvent,
          CancelApprovedEvent:com.ecommerce.orderservice.event.CancelApprovedEvent,
          CancelRequestedEvent:com.ecommerce.orderservice.event.CancelRequestedEvent,
          CancelRejectedEvent:com.ecommerce.orderservice.event.CancelRejectedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >-
          OrderCreatedEvent:com.ecommerce.orderservice.event.OrderCreatedEvent,
          OrderCancelledEvent:com.ecommerce.orderservice.event.OrderCancelledEvent,
          StockDecreasedEvent:com.ecommerce.orderservice.event.StockDecreasedEvent,
          StockDecreaseFailedEvent:com.ecommerce.orderservice.event.StockDecreaseFailedEvent,
          CouponUsedEvent:com.ecommerce.orderservice.event.CouponUsedEvent,
          CouponUseFailedEvent:com.ecommerce.orderservice.event.CouponUseFailedEvent,
          PaymentFailedEvent:com.ecommerce.orderservice.event.PaymentFailedEvent,
          PaymentCompletedEvent:com.ecommerce.orderservice.event.PaymentCompletedEvent,
          CancelApprovedEvent:com.ecommerce.orderservice.event.CancelApprovedEvent,
          CancelRequestedEvent:com.ecommerce.orderservice.event.CancelRequestedEvent,
          CancelRejectedEvent:com.ecommerce.orderservice.event.CancelRejectedEvent

jwt:
  secret: "test-secret-key-minimum-32-characters-required-for-testing"

server:
  port: 0

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
    product-service:
      url: "http://localhost:8081"
    payment-service:
      url: "http://localhost:8084"

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.kafka: INFO
    org.testcontainers: INFO
