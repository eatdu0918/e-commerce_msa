spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://localhost:3309/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        highlight_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: ${REDIS_PORT:6379}
      password: "${REDIS_PASSWORD:}"
  kafka:
    bootstrap-servers: "${KAFKA_SERVERS:localhost:9092}"
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: >-
          OrderCreatedEvent:com.ecommerce.orderservice.event.OrderCreatedEvent,
          OrderCancelledEvent:com.ecommerce.orderservice.event.OrderCancelledEvent,
          StockDecreasedEvent:com.ecommerce.orderservice.event.StockDecreasedEvent,
          StockDecreaseFailedEvent:com.ecommerce.orderservice.event.StockDecreaseFailedEvent,
          CouponUsedEvent:com.ecommerce.orderservice.event.CouponUsedEvent,
          CouponUseFailedEvent:com.ecommerce.orderservice.event.CouponUseFailedEvent,
          PaymentFailedEvent:com.ecommerce.orderservice.event.PaymentFailedEvent,
          CancelApprovedEvent:com.ecommerce.orderservice.event.CancelApprovedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        spring.json.type.mapping: >-
          OrderCreatedEvent:com.ecommerce.orderservice.event.OrderCreatedEvent,
          OrderCancelledEvent:com.ecommerce.orderservice.event.OrderCancelledEvent

jwt:
  secret: "${JWT_SECRET:your-256-bit-secret-key-here-minimum-32-characters-required}"

server:
  port: 8082

springdoc:
  api-docs:
    enabled: true
    path: /api/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/swagger-ui.html
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  paths-to-match: /**
  packages-to-scan: com.ecommerce.orderservice

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
    product-service:
       url: "${PRODUCT_SERVICE_URL:http://localhost:8081}"
    payment-service:
       url: "${PAYMENT_SERVICE_URL:http://localhost:8084}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework: INFO
    org.flywaydb: DEBUG
    org.apache.kafka: INFO
