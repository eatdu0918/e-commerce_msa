server:
  port: 8000

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/users/**, /api/auth/**
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/products/**, /api/categories/**, /api/cart/**, /api/wishlist/**, /api/reviews/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/orders/**
        - id: discount-service
          uri: ${DISCOUNT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/discounts/**, /api/coupons/**
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/payments/**
        - id: cancel-service
          uri: ${CANCEL_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/cancels/**
        - id: refund-service
          uri: ${REFUND_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/refunds/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - "X-Correlation-Id"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-minimum-32-characters-required}

logging:
  level:
    com.ecommerce.gatewayservice: INFO
    org.springframework.cloud.gateway: INFO
