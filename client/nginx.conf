server {
    listen 80;

    # Docker / Kubernetes: 게이트웨이와 동일 네트워크에서 호스트명 gateway-service 사용
    # VITE_API_URL 비우면 브라우저가 같은 출처 /api 로 요청 → 여기서 프록시
    # (K8s 클러스터 내부에서는 ConfigMap(client-nginx-conf)이 이 파일을 덮어쓰며,
    #  이 파일은 docker-compose 또는 단독 이미지 실행 시의 기본값으로만 쓰인다.
    #  K8s ConfigMap 정본: k8s/common/client-nginx-configmap.yaml — 변경 시 함께 맞출 것.)
    location /api {
        proxy_pass http://gateway-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Kafka UI: 컨테이너에 SERVER_SERVLET_CONTEXT_PATH=/kafka 설정되어 있어
    # 서브패스 그대로 프록시. (외부 ngrok 진입 시 ingress 대신 client nginx 가 라우팅)
    location /kafka {
        proxy_pass http://kafka-ui:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # kafka-ui는 WebSocket(STOMP/SockJS) 사용
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Kubernetes 대시보드(/k8s) 라우팅은 K8s 환경 전용이므로 이 파일에는 두지 않는다.
    # 클러스터 배포 시 ConfigMap(client-nginx-conf, k8s/common/client-nginx-configmap.yaml)이
    # 이 default.conf 를 덮어쓰면서 /k8s/ 프록시를 추가한다.
    # 여기서 dashboard-bridge 호스트를 참조하면 docker-compose 환경에서 nginx 부팅이 실패하므로 의도적으로 제외.

    # 통합 Swagger UI: 게이트웨이의 springdoc 가 모든 서비스 OpenAPI 를 모아 노출.
    # 외부에서 /swagger-ui.html 로 들어오면 게이트웨이로 그대로 전달한다.
    # springdoc 가 사용하는 보조 경로(/swagger-ui/, /v3/api-docs, /webjars)도 같이 열어준다.
    location = /swagger-ui.html {
        proxy_pass http://gateway-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /swagger-ui/ {
        proxy_pass http://gateway-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /v3/api-docs {
        proxy_pass http://gateway-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /webjars/ {
        proxy_pass http://gateway-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 콘텐츠 해시가 붙은 정적 자산: 브라우저/CDN 장기 캐시 (immutable)
    # 파일명이 바뀌면 자동으로 새 URL이 되므로 안전하게 캐시 가능
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|webp|ico)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        # SPA 진입점은 절대 캐시하지 말 것 — 새 빌드의 chunk 해시를 즉시 반영해야 함
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires 0;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
