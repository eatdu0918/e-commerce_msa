spring:
  application:
    name: user-service
  servlet:
    multipart:
      max-file-size: 100GB
      max-request-size: 100GB
  web:
    resources:
      static-locations: classpath:/static/
  datasource:
    url: jdbc:mysql://localhost:3307/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        highlight_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-minimum-32-characters-required}
  access-token:
    expiration: 1800000    # 30분 (밀리초)
  refresh-token:
    expiration: 604800000  # 7일 (밀리초)

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  api-docs:
    enabled: true
    path: /api/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/swagger-ui.html
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  paths-to-match: /**
  packages-to-scan: com.ecommerce.userservice

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework: INFO
    org.springframework.web.servlet.resource: ERROR
    org.flywaydb: DEBUG