apiVersion: apps/v1
kind: Deployment
metadata:
  name: refund-mysql
  namespace: sparta-msa
spec:
  replicas: 1
  progressDeadlineSeconds: 2400
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: refund-mysql
  template:
    metadata:
      labels:
        app: refund-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0.40
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: sparta-msa-config
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_ROOT_HOST
          value: "%"
        - name: MYSQL_DATABASE
          value: refund_db
        args:
          - --character-set-server=utf8mb4
          - --collation-server=utf8mb4_unicode_ci
          - --innodb-buffer-pool-size=32M
          - --innodb-buffer-pool-instances=1
          - --innodb-redo-log-capacity=64M
          - --max-connections=25
          - --skip-performance-schema
          - --table-open-cache=100
          - --skip-log-bin
          - --sort-buffer-size=256K
          - --read-buffer-size=256K
          - --read-rnd-buffer-size=256K
          - --join-buffer-size=256K
          - --tmp-table-size=8M
          - --max-heap-table-size=8M
        startupProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 120
        readinessProbe:
          tcpSocket:
            port: 3306
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 5
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1500m"
            memory: "2560Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: refund-mysql
  namespace: sparta-msa
spec:
  ports:
  - port: 3306
    targetPort: 3306
  selector:
    app: refund-mysql
