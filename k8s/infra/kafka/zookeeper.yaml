# 사용 안 함: Kafka를 Apache KRaft(`infra/kafka/kafka.yaml`)로 옮겨 kustomization에서 빠졌습니다. 참고용으로만 남김.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: sparta-msa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.5.0
        ports:
        - containerPort: 2181
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx512M -Xms128M"
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: sparta-msa
spec:
  ports:
  - port: 2181
    targetPort: 2181
  selector:
    app: zookeeper
