# Kafka 프로토콜 브로커 (KRaft 단일 프로세스, apache/kafka — Minikube 개발용)
# 클라이언트는 동일하게 kafka:9092 로 접속합니다.
# 개발 편의: emptyDir 사용(Pod 재생성 시 토픽 초기화). 영구 브로커가 필요하면 PVC로 교체하세요.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: sparta-msa
spec:
  replicas: 1
  progressDeadlineSeconds: 900
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      volumes:
      - name: kafka-data
        emptyDir:
          sizeLimit: 8Gi
      containers:
      - name: kafka
        image: docker.io/apache/kafka:3.8.1
        ports:
        - containerPort: 9092
          name: kafka
        env:
        # Pod(emptyDir) 단위로 신규 클러스터. 컨테이너만 재시작 반복 시 메타 불일치 방지용으로 기존과 다른 ID 사용.
        - name: CLUSTER_ID
          value: "Zx9mK2qV8bN5pR3wL7hJ1As"
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_PROCESS_ROLES
          value: "broker,controller"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka:9092"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@127.0.0.1:9093"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "1"
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: "0"
        - name: KAFKA_LOG_DIRS
          value: "/var/lib/kafka/data"
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx384m -Xms256m -XX:+UseG1GC"
        - name: KAFKA_NUM_NETWORK_THREADS
          value: "2"
        - name: KAFKA_NUM_IO_THREADS
          value: "4"
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data
        startupProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: 9092
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          requests:
            cpu: "200m"
            memory: "1536Mi"
          limits:
            cpu: "1500m"
            memory: "6656Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: sparta-msa
spec:
  ports:
  - port: 9092
    targetPort: 9092
    name: plaintext
  selector:
    app: kafka
