# Minikube: minikube addons enable ingress
# /etc/hosts: <minikube ip> sparta-msa.local  → http://sparta-msa.local
# Ingress 없이 바로 접속: kubectl get svc -n sparta-msa client → NodePort 30080
#   예: http://$(minikube ip):30080
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sparta-msa
  namespace: sparta-msa
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /swagger
        pathType: Prefix
        backend:
          service:
            name: gateway-service
            port:
              number: 8000
      - path: /swagger-ui
        pathType: Prefix
        backend:
          service:
            name: gateway-service
            port:
              number: 8000
      - path: /v3/api-docs
        pathType: Prefix
        backend:
          service:
            name: gateway-service
            port:
              number: 8000
      - path: /webjars
        pathType: Prefix
        backend:
          service:
            name: gateway-service
            port:
              number: 8000
      - path: /kafka
        pathType: Prefix
        backend:
          service:
            name: kafka-ui
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: client
            port:
              number: 80
