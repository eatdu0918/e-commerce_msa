apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: sparta-msa
spec:
  replicas: 1
  progressDeadlineSeconds: 2700
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: order-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8082
        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:TieredStopAtLevel=1 -Xmx512m -Xms64m -XX:MaxMetaspaceSize=144m -XX:ReservedCodeCacheSize=32m -XX:+ExitOnOutOfMemoryError"
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
        - name: SPRING_DATASOURCE_USERNAME
          value: "root"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: sparta-msa-config
              key: MYSQL_ROOT_PASSWORD
        - name: SPRING_DATA_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: sparta-msa-config
              key: REDIS_HOST
        - name: SPRING_DATA_REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: sparta-msa-config
              key: REDIS_PORT
        - name: KAFKA_SERVERS
          value: "kafka:9092"
        - name: PRODUCT_SERVICE_URL
          value: "http://product-service:8081"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service:8084"
        - name: CANCEL_SERVICE_URL
          value: "http://cancel-service:8085"
        - name: JWT_SECRET
          valueFrom:
            configMapKeyRef:
              name: sparta-msa-config
              key: JWT_SECRET
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8082
          initialDelaySeconds: 90
          failureThreshold: 150
          periodSeconds: 10
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8082
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            cpu: "300m"
            memory: "448Mi"
          limits:
            cpu: "2000m"
            memory: "2560Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: sparta-msa
spec:
  ports:
  - port: 8082
    targetPort: 8082
  selector:
    app: order-service
