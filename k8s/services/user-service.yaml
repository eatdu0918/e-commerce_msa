apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: sparta-msa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: user-service:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://user-mysql:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
        - name: SPRING_DATASOURCE_USERNAME
          value: "root"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: sparta-msa-config
              key: MYSQL_ROOT_PASSWORD
        - name: SPRING_DATA_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: sparta-msa-config
              key: REDIS_HOST
        - name: SPRING_DATA_REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: sparta-msa-config
              key: REDIS_PORT
        - name: JWT_SECRET
          valueFrom:
            configMapKeyRef:
              name: sparta-msa-config
              key: JWT_SECRET
        resources:
          limits:
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: sparta-msa
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: user-service
