# Blue/Green: gateway-service-blue / gateway-service-green
# 활성 트래픽: Service gateway-service 의 spec.selector.slot (blue | green)
# 미리보기(비활성 슬롯): gateway-preview-blue, gateway-preview-green (ClusterIP)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service-blue
  namespace: sparta-msa
spec:
  replicas: 1
  progressDeadlineSeconds: 2700
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: gateway-service
      slot: blue
  template:
    metadata:
      labels:
        app: gateway-service
        slot: blue
    spec:
      containers:
      - name: gateway-service
        image: gateway-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:TieredStopAtLevel=1 -Xmx448m -Xms64m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64m -XX:ReservedCodeCacheSize=32m -XX:+ExitOnOutOfMemoryError"
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: sparta-msa-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: sparta-msa-config
              key: REDIS_PORT
        - name: USER_SERVICE_URL
          value: "http://user-service:8080"
        - name: PRODUCT_SERVICE_URL
          value: "http://product-service:8081"
        - name: ORDER_SERVICE_URL
          value: "http://order-service:8082"
        - name: DISCOUNT_SERVICE_URL
          value: "http://discount-service:8083"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service:8084"
        - name: CANCEL_SERVICE_URL
          value: "http://cancel-service:8085"
        - name: REFUND_SERVICE_URL
          value: "http://refund-service:8086"
        - name: JWT_SECRET
          valueFrom:
            configMapKeyRef:
              name: sparta-msa-config
              key: JWT_SECRET
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8000
          initialDelaySeconds: 90
          failureThreshold: 150
          periodSeconds: 10
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            cpu: "300m"
            memory: "448Mi"
          limits:
            cpu: "2000m"
            memory: "2560Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service-green
  namespace: sparta-msa
spec:
  replicas: 1
  progressDeadlineSeconds: 2700
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: gateway-service
      slot: green
  template:
    metadata:
      labels:
        app: gateway-service
        slot: green
    spec:
      containers:
      - name: gateway-service
        image: gateway-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:TieredStopAtLevel=1 -Xmx448m -Xms64m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64m -XX:ReservedCodeCacheSize=32m -XX:+ExitOnOutOfMemoryError"
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: sparta-msa-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: sparta-msa-config
              key: REDIS_PORT
        - name: USER_SERVICE_URL
          value: "http://user-service:8080"
        - name: PRODUCT_SERVICE_URL
          value: "http://product-service:8081"
        - name: ORDER_SERVICE_URL
          value: "http://order-service:8082"
        - name: DISCOUNT_SERVICE_URL
          value: "http://discount-service:8083"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service:8084"
        - name: CANCEL_SERVICE_URL
          value: "http://cancel-service:8085"
        - name: REFUND_SERVICE_URL
          value: "http://refund-service:8086"
        - name: JWT_SECRET
          valueFrom:
            configMapKeyRef:
              name: sparta-msa-config
              key: JWT_SECRET
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8000
          initialDelaySeconds: 90
          failureThreshold: 150
          periodSeconds: 10
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            cpu: "300m"
            memory: "448Mi"
          limits:
            cpu: "2000m"
            memory: "2560Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: sparta-msa
spec:
  type: LoadBalancer
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: gateway-service
    slot: blue
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-preview-blue
  namespace: sparta-msa
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: gateway-service
    slot: blue
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-preview-green
  namespace: sparta-msa
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: gateway-service
    slot: green
