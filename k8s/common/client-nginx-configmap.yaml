# Docker Compose 는 이미지 내장 nginx.conf(짧은 호스트명) 사용.
# 클러스터 DNS: FQDN으로 기동 시점에 안정적으로 해석됩니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: client-nginx-conf
  namespace: sparta-msa
data:
  default.conf: |
    server {
        listen 80;
        location /api {
            # ClusterIP가 안정적이므로 CoreDNS IP 하드코딩 없이 서비스 FQDN으로 프록시
            proxy_pass http://gateway-service.sparta-msa.svc.cluster.local:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
